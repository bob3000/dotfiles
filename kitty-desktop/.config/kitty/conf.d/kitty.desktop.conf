tab_bar_style     custom
tab_bar_min_tabs  1
tab_bar_edge      bottom

# --- brightness ---
map f7 launch --type=background brightnessctl set 5%+
map f6 launch --type=background brightnessctl set 5%-

# --- volume (WirePlumber; follows the default sink, covers speaker and headphones) ---
map f10 launch --type=background wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
map f9  launch --type=background wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
map f8  launch --type=background wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# --- media (cmus must be running) ---
map f3 launch --type=background cmus-remote -u
map f2 launch --type=background cmus-remote -n
map f1 launch --type=background cmus-remote -r

# --- session (elogind) ---
map f4 launch --type=background doas physlock
