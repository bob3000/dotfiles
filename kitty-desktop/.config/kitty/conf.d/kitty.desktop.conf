tab_bar_style     custom
tab_bar_min_tabs  1
tab_bar_edge      bottom

# --- brightness ---
map XF86MonBrightnessUp    launch --type=background brightnessctl set 5%+
map XF86MonBrightnessDown  launch --type=background brightnessctl set 5%-

# --- volume (WirePlumber; follows the default sink, covers speaker and headphones) ---
map XF86AudioRaiseVolume   launch --type=background wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
map XF86AudioLowerVolume   launch --type=background wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
map XF86AudioMute          launch --type=background wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# --- media (cmus must be running) ---
map XF86AudioPlay          launch --type=background cmus-remote -u
map XF86AudioNext          launch --type=background cmus-remote -n
map XF86AudioPrev          launch --type=background cmus-remote -r

# --- applications ---
map f11                    launch --type=tab cmus
map f12                    launch --type=overlay impala

# --- session (elogind) ---
map ctrl+alt+l             launch --type=background doas physlock
map ctrl+alt+s             launch --type=background loginctl suspend
map ctrl+alt+p             launch --type=background loginctl poweroff
