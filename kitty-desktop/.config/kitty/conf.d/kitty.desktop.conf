tab_bar_style custom
tab_bar_min_tabs 1
tab_bar_edge bottom
tab_powerline_style angled
tab_title_max_length 30
tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{index} {tab.active_exe}"

# --- brightness ---
map f7 launch --type=background brightnessctl set 5%+
map f6 launch --type=background brightnessctl set 5%-

# --- volume (WirePlumber; follows the default sink, covers speaker and headphones) ---
map f10 launch --type=overlay sh -c "wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+ 2> /dev/null; wpctl get-volume @DEFAULT_AUDIO_SINK@ 2> /dev/null | awk '{printf \"vol: %.0f%% %s\", $2*100, $3}'; sleep 1"
map f9  launch --type=overlay sh -c "wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- 2> /dev/null; wpctl get-volume @DEFAULT_AUDIO_SINK@ 2> /dev/null | awk '{printf \"vol: %.0f%% %s\", $2*100, $3}'; sleep 1"
map f8  launch --type=overlay sh -c "wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle 2> /dev/null; wpctl get-volume @DEFAULT_AUDIO_SINK@ 2> /dev/null | awk '{printf \"vol: %.0f%% %s\", $2*100, $3}'; sleep 1"

# --- media (cmus must be running) ---
map f3 launch --type=background cmus-remote -u
map f2 launch --type=background cmus-remote -n
map f1 launch --type=background cmus-remote -r

# --- screen lock ---
map f4 launch --type=background doas /usr/bin/physlock
# --- wifi networks ---
map f5 launch --type=background doas /usr/bin/impala
