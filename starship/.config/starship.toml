# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

palette = "catppuccin_macchiato"
right_format = """$username$hostname$localip${env_var.TTY}$cmd_duration$time"""
format = "$git_branch$git_status$directory$fill$all$line_break$status$os$shlvl${env_var.FISH_PRIVATE_MODE}$shell$character"

[fill]
symbol = ' '

[aws]
format = '[$symbol \(($profile )($region )($duration)\) ]($style)'
symbol = "󰸏"
expiration_symbol = " "
disabled = false

[azure]
format = "[$symbol($subscription)]($style) "
symbol = ' '
disabled = true

[cpp]
format = "[$symbol($version(-$name) )]($style)"
disabled = false

[env_var.FISH_PRIVATE_MODE]
description = 'if fish is running in private mode'
style = "bold fg:black bg:lavender"
symbol = ' ' # why is this symbol invisible in nvim?
default = ''
format = '[$env_value]($style)'

[env_var.TTY]
default = ''
format = '[$env_value]($style)'
disabled = true

[git_branch]
symbol = '🌵 '
truncation_symbol = "…"
format = "[$branch(:$remote_branch)]($style) "
style = "bold mauve"

[git_status]
format = '[$all_status$ahead_behind ]($style)'
style = "bold flamingo"
conflicted = ' '
stashed = ''
staged = " "
modified = " "
untracked = "󰎔 "
deleted = " "
renamed = " "
diverged = " "
ahead = " "
behind = " "
worktree_added = "🪾+"
worktree_deleted = "🪾-"
worktree_modified = "🪾~"

[package]
format = "[$symbol$version]($style) "
disabled = true

[gcloud]
symbol = '️ '
# detect_env_vars = ["GCLOUD"]
disabled = true

[direnv]
format = "[$symbol$loaded/$allowed]($style)"
symbol = '📂'
allowed_msg = '👍'
not_allowed_msg = '👎'
denied_msg = '✋'
loaded_msg = '👌'
unloaded_msg = '👋'
disabled = false

[shlvl]
disabled = false
style = "bold fg:black bg:lavender"
format = '[$symbol ]($style)'
repeat = true
symbol = '󰍹'
repeat_offset = 1
threshold = 2

[c]
format = "[$symbol($version(-$name) )]($style)"
commands = [["clang", "--version"], ["gcc", "--version"], ["cc", "--version"]]
symbol = " "

[cmake]
format = "[$symbol($version )]($style)"

[docker_context]
format = "[$symbol$context]($style) "
symbol = " "

[container]
symbol = "🧳"

[java]
format = "[$symbol($version )]($style)"
symbol = " "

[python]
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'
style = "green bold"
pyenv_version_name = false
symbol = " "

[jobs]
symbol = "🔨"

[conda]
format = "[$symbol$environment]($style) "

[nodejs]
format = "[$symbol($version )]($style)"

[golang]
format = "[$symbol($version )]($style)"
symbol = "󰟓 "

[rust]
format = "[$symbol($version )]($style)"
symbol = " "

[terraform]
format = "[$symbol$workspace]($style) "
symbol = " "

[vagrant]
format = "[$symbol($version )]($style)"
symbol = "🧌 "

[zig]
format = "[$symbol($version )]($style)"
symbol = " "

[username]
format = '[$user]($style)'
# show_always = true

[hostname]
# ssh_only = false
format = '@[$hostname]($style) [$ssh_symbol]($style)'

[localip]
# ssh_only = false
format = '[\($localipv4\) ]($style)'
disabled = false

[time]
disabled = false
style = "bold lavender"
format = '🕗 [$time]($style)'
time_format = '%T'
utc_time_offset = '+0'

[cmd_duration]
style = "bold mauve"
format = "[⏱️ ($duration )]($style)"
min_time = 600
show_milliseconds = true
# show_notifications = true
# min_time_to_notify = 45000

[directory]
truncation_length = 8
truncation_symbol = '…/'
# fish_style_pwd_dir_length = 2
truncate_to_repo = true
style = "bold lavender"

[sudo]
format = "$symbol($style)"
symbol = "🔓 "
disabled = true # takes too much time to execute

[kubernetes]
format = '[$symbol$context( \($namespace\))]($style) '
symbol = "󰠳 "
detect_folders = ['charts', 'clusters', 'kubernetes', 'k8s', 'kube']
detect_files = ['Chart.yaml']
disabled = false

[character]
success_symbol = '[](bold fg:green)'
error_symbol = '[](bold red)'

[shell]
fish_indicator = '🐟'
bash_indicator = '#!'
powershell_indicator = '_'
zsh_indicator = '💤'
unknown_indicator = 'mystery shell'
style = 'bold bg:lavender'
format = "[$indicator ]($style)[](fg:lavender)"
disabled = false

[status]
style = "bold fg:black bg:maroon"
format = '[ $symbol$common_meaning$signal_name$maybe_int ]($style)[](fg:maroon bg:blue)'
pipestatus_format = "[$pipestatus](bold fg:black bg:maroon)[](fg:maroon bg:blue)"
pipestatus_separator = ""
pipestatus_segment_format = '[ $symbol$common_meaning$signal_name$maybe_int]($style)[](fg:maroon bg:maroon)'
symbol = " "
sigint_symbol = "🫵"
map_symbol = true
pipestatus = true
disabled = false

[memory_usage]
threshold = 95
disabled = false

[os]
disabled = false
style = "bold fg:black bg:blue"
format = "[ $symbol]($style)[ ](fg:blue bg:lavender)"

[os.symbols]
Alpine = " "
Arch = "󰣇 "
Debian = " "
Fedora = " "
Macos = " "
Ubuntu = " "

[git_metrics]
disabled = true

