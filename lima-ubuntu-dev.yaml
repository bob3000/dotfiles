# lima-ubuntu-dev.yaml
# Lima VM template — Ubuntu
# Ref: https://lima-vm.io/docs/config/
# Requires: Lima >= 2.1.0

minimumLimaVersion: "2.1.0"

base:
  - template:default

cpus: 4
memory: "4GiB"

mounts:
  - location: "~/code"
    mountPoint: "/home/{{.User}}/code"
    writable: true
  - location: "~/.dotfiles"
    mountPoint: "/home/{{.User}}.guest/.dotfiles"
    writable: true

provision:
  - mode: data
    path: /etc/profile.d/99-linuxbrew.sh
    # nofile is increased due to https://github.com/Homebrew/brew/issues/9120
    content: |
      ulimit -n 65536
      [ -e /home/linuxbrew/.linuxbrew/bin/brew ] && eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      command -v gcc >/dev/null 2>&1 && exit 0
      export DEBIAN_FRONTEND=noninteractive
      apt-get update
      apt-get install -y build-essential
  - mode: user
    script: |
      #!/bin/bash
      set -eux -o pipefail
      [ -e /home/linuxbrew ] && exit 0
      /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      apt update
      apt install -y --no-install-recommends \
        kitty-terminfo
  - mode: user
    script: |
      #!/bin/bash
      set -eux -o pipefail
      echo >> /home/{{.User}}.guest/.bashrc
      grep -q 'shellenv' /home/{{.User}}.guest/.bashrc || echo 'eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv bash)"' >> /home/{{.User}}.guest/.bashrc
      eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv bash)"
      brew tap hashicorp/tap
      brew trust hashicorp/tap
      brew install -y \
        bat \
        direnv \
        eza \
        fd \
        fish \
        fisher \
        fnm \
        fzf \
        gh \
        git \
        git-delta \
        gnupg \
        go \
        lazygit \
        luarocks \
        ncdu \
        neovim \
        node \
        ripgrep \
        sops \
        starship \
        stow \
        terraform \
        tree-sitter \
        tree-sitter-cli \
        uv
      bash -c 'cd /home/{{.User}}.guest/.dotfiles && stow -v \
        bat \
        fish \
        git \
        lazygit \
        nvim \
        starship \
        tmux \
      '
      mkdir -p /home/{{.User}}.guest/.cache/nvim
      nvim --headless "+Lazy! sync" +qa
      nvim --headless "+TSUpdate" +qa
      nvim --headless "+MasonToolsInstallSync" +qa
      git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm

probes:
  - script: |
      #!/bin/bash
      set -eux
      test -f /home/linuxbrew/.linuxbrew/bin/nvim
    hint: |
      Provisioning incomplete. Check logs:
      limactl shell ubuntu-dev sudo journalctl -u cloud-final
      limactl shell ubuntu-dev sudo less /var/log/cloud-init-output.log
